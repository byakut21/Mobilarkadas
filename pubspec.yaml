name: yerel_asistan
description: Tamamen çevrimdışı çalışan, cihaz içi GGUF model sohbet uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # llama.cpp FFI bağlayıcısı. API bu sürüme göre yazıldı (lib/core/llm_worker.dart).
  # v0.2.0 kaynağı: önce `scripts/fetch_llama_cpp_dart.sh` çalıştırın.
  # (pub.dev'de 0.2.0 yok; git deposu kırık symlink içerdiği için doğrudan git bağımlılığı olmuyor)
  llama_cpp_dart:
    path: .build/llama_cpp_dart
  # C string dönüşümü (llama.cpp log yakalama)
  ffi: ^2.1.4
  # Dosya seçici (Android SAF; ağ izni gerektirmez)
  file_picker: ^13.4.0
  # Uygulamaya özel dizin (modeli buraya kopyalıyoruz)
  path_provider: ^2.1.4
  # Ayarların yerel saklanması
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
