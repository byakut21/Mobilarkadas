name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Araçlar
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # ---- llama.cpp native kütüphaneleri (önbellekli) ----
      - name: Native kütüphane önbelleği
        id: native-cache
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: llama-native-v0.2.0-armv82-${{ hashFiles('scripts/build_llama_android.sh') }}

      - name: llama.cpp derle (arm64-v8a)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK"
          bash scripts/build_llama_android.sh

      # ---- Flutter Android iskeleti (repo'daki manifest'ler korunur) ----
      - name: Android iskeletini oluştur
        run: |
          flutter create --platforms android --org tr.burak --project-name yerel_asistan /tmp/scaffold
          cp -rn /tmp/scaffold/android/. android/
          cp -n /tmp/scaffold/.metadata . || true

      - name: Gradle ayarları (arm64, minSdk 28, native paketleme)
        run: |
          F=android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/' "$F"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = flutter.targetSdkVersion\n        ndk { abiFilters += listOf("arm64-v8a") }/' "$F"
          cat >> "$F" <<'EOF'

          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      pickFirsts += listOf("**/libc++_shared.so")
                  }
              }
          }
          EOF
          cat "$F"

      - name: Bağımlılıklar
        run: flutter pub get

      - name: APK derle
        run: flutter build apk --release --target-platform android-arm64

      - name: İzin kontrolü (INTERNET olmamalı)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::APK INTERNET izni içeriyor!"; exit 1
          fi
          $AAPT list build/app/outputs/flutter-apk/app-release.apk | grep "lib/arm64-v8a/"
          cp build/app/outputs/flutter-apk/app-release.apk YerelAsistan.apk

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YerelAsistan-apk
          path: YerelAsistan.apk

      - name: Release (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Yerel Asistan build ${{ github.run_number }}
          files: YerelAsistan.apk
          body: "Çevrimdışı GGUF sohbet APK'sı (arm64-v8a). INTERNET izni yok."
